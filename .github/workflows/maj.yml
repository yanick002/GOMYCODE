name: Mise a jour des donnees BRVM

on:
  schedule:
    # Trois releves par jour, du lundi au vendredi (heures UTC = heures d'Abidjan). La BRVM ferme a 15h00 et la source ne
    # publie qu'une ligne par seance (ouverture, haut, bas, cloture, volume), apres la cloture, a une heure qui varie.
    # 15h05 et 15h30 : passages LEGERS, trois requetes de controle, et la collecte complete seulement si la seance du jour
    # est publiee. 16h30 : releve complet de rattrapage si la source a publie tard. Un commit n'est cree que s'il y a
    # du nouveau : en principe un seul par jour.
    # GitHub peut retarder un passage de quelques minutes aux heures chargees.
    - cron: "5 15 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write           # necessaire pour que le job puisse commiter

concurrency:
  group: maj-donnees
  cancel-in-progress: false

defaults:
  run:
    # Le projet vit dans brvm-data/ : toutes les commandes partent de la.
    working-directory: brvm-data

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Aucune dependance externe : les scripts n'utilisent que la
      # bibliotheque standard. Rien a installer.

      - name: Relever le nombre de titres
        # Une fois par jour (releve de 16h30) : chaque passage coute 49 requetes a richbourse.
        if: github.event_name != 'schedule' || github.event.schedule == '30 16 * * 1-5'
        # Sert a la valorisation et au capital echange. Releve chaque jour
        # plutot que fige : c'est ce qui rattrapera automatiquement le
        # fractionnement Sonatel du 26 octobre 2026 (1 pour 10). En cas
        # d'echec, la valeur precedente est conservee : ne bloque pas le job.
        continue-on-error: true
        run: python scraper/faire_actions.py

      - name: Collecter les cours
        id: collecte
        # 49 actions + 18 indices. Echoue si plus de la moitie des tickers
        # tombent, ou si aucune seance fraiche depuis 3 jours ouvres.
        # Passages legers (15h05, 15h30) : une panne passagere de la source n'est pas une alerte, le releve suivant
        # reessaiera ; les etapes suivantes sautent alors. Le releve de 16h30 et le lancement a la main restent stricts :
        # s'ils echouent, GitHub previent par e-mail.
        continue-on-error: ${{ github.event_name == 'schedule' && github.event.schedule != '30 16 * * 1-5' }}
        run: python scraper/collecte.py ${{ (github.event_name == 'schedule' && github.event.schedule != '30 16 * * 1-5') && '--leger' || '' }}

      - name: Calculer les indicateurs
        if: steps.collecte.outcome == 'success'
        # RSI de Wilder, Beta contre le BRVM Composite, variations par
        # fenetre. Le serveur MCP ne calcule rien : il lit ces fichiers.
        run: python scraper/indicateurs.py

      - name: Controler le RSI contre la reference
        # Une fois par jour, comme le nombre de titres.
        if: steps.collecte.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '30 16 * * 1-5')
        # Compare notre calcul a celui affiche par richbourse sur un
        # echantillon. Ne fait pas echouer le job : c'est un signal, pas une
        # dependance. Une divergence apparait en rouge dans le journal.
        continue-on-error: true
        run: python scraper/controle_rsi.py

      - name: Commiter les donnees
        if: steps.collecte.outcome == 'success'
        run: |
          git config user.name "brvm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ scraper/actions.json
          if git diff --staged --quiet; then
            echo "Aucun changement, rien a commiter."
          else
            git commit -m "Donnees du $(date -u '+%Y-%m-%d') UTC"
            # Un push arrive entre-temps (depuis le PC) : on le reprend avant de pousser.
            git pull --rebase
            git push
          fi
